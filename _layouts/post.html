---
layout: default
---
<article class="post">
  <header>
    <h1>{{ page.title }}</h1>
    <p class="post-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time></p>
  </header>

  {{ content }}
</article>

<p class="back"><a href="{{ '/' | relative_url }}">← back</a></p>
